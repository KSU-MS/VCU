; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
lib_deps = 
  https://github.com/tonton81/FlexCAN_T4
  https://github.com/VishnuEaswaran/ADS1018-Library
  https://github.com/KSU-MS/pio-git-hash-gen
  https://github.com/KSU-MS/ksu-ms-dbc/releases/download/146/can_lib.tar.gz
; The firmware for A/B slot A, plus (scripts/vcu_images.py):
;   vcu-a.ota         signed OTA image for slot A
;   firmware.hex      USB bundle: bootloader + slot A + fresh boot state, so
;                     `pio run -e teensy41 -t upload` sets up a whole board
;   app.hex           just the slot A firmware
board_build.ldscript = ldscripts/slot_a.ld
build_flags =
  -DVCU_SLOT=0
  -Lldscripts
; Public key OTA images must be signed with, see keys/README.md
extra_scripts =
  pre:scripts/ota_key.py
  post:scripts/vcu_images.py

; The same firmware for slot B: the other half of every OTA update
;   pio run -e teensy41_b    -> .pio/build/teensy41_b/vcu-b.ota
[env:teensy41_b]
extends = env:teensy41
board_build.ldscript = ldscripts/slot_b.ld
build_flags =
  -DVCU_SLOT=1
  -Lldscripts

; Host build of the control logic on top of lib/vcu_sim, for tests
;   pio test -e native
[env:native]
platform = native
test_framework = doctest
test_build_src = yes
; main.cpp is the Teensy glue (ADC reads, Logger), everything else is logic
build_src_filter = +<*> -<main.cpp>
build_flags =
  -std=gnu++17
  -Wall
  -Werror=return-type
  ; Catch memory errors and UB (incl. float->int overflow, which GCC leaves
  ; out of -fsanitize=undefined) and make them fail the test run
  -fsanitize=address,undefined,float-cast-overflow
  -fno-sanitize-recover=all
  -fno-omit-frame-pointer
  ; lib/vcu_sim needs the firmware headers
  -Iinclude
  -DAUTO_VERSION=0
  -DFW_PROJECT_IS_DIRTY=0
  -DFW_PROJECT_IS_MAIN_OR_MASTER=0
extra_scripts =
  pre:scripts/native_skip_arduino.py
  pre:scripts/ota_key.py
lib_deps =
  https://github.com/KSU-MS/ksu-ms-dbc/releases/download/146/can_lib.tar.gz

; The firmware as a Linux program on SocketCAN, see sil/sil_main.cpp
;   pio run -e sil && .pio/build/sil/program --help
[env:sil]
extends = env:native
build_src_filter = +<*> -<main.cpp> +<../sil/>

; The A/B bootloader (bootloader/): bare metal, no Arduino core, the first
; 64 KB of flash. Goes on the board as part of the USB bundle, see
; scripts/vcu_images.py.
[env:bootloader]
platform = teensy
board = teensy41
build_src_filter = -<*> +<../bootloader/>
build_unflags = -std=gnu++14
build_flags =
  -std=gnu++17
  -Wall
  -Werror=return-type
  -fno-exceptions
  -nostartfiles
  --specs=nano.specs
  -Wl,-T,bootloader/bootloader.ld
  -Wl,-Map,.pio/build/bootloader/bootloader.map
extra_scripts =
  pre:scripts/ota_key.py
  pre:scripts/bare_ranlib.py
